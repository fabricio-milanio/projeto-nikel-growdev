<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Nikel</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="row">
                <div class="col">
                    <div>
                        <p>
                            Organize suas finanças de uma forma fácil.
                        </p>
                        <p>
                            Controle seu dinheiro e investimentos.
                        </p>
                        <p>
                            Economize e atinja seus objetivos.
                        </p>
                    </div>
                    <div>
                        <img src="./assets/images/pocket.png" alt="imagem de uma carteira de dinheiro, com um celular e moedas" srcset="">
                        <img src="./assets/images/coins.png" alt="moedas" srcset="">
                    </div>
                </div>

                <div class="col">
                    <div class="container">
                        
                        <div class="row">
                            <div class="col">
                                <img src="./assets/images/nikel-logo.png" alt="logo da aplicação nikel" class="img-fluid" srcset="">
                            </div>
                            
                            <div class="col">
                                <form>
                                    <div class="mb-3">
                                        <label for="exampleInputEmail1" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Digite aqui o seu E-mail">
                                        <div id="emailHelp" class="form-text">Utilize seu e-mail para realizar o login.</div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="exampleInputPassword1" class="form-label">Senha</label>
                                        <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Digite aqui a sua senha">
                                    </div>
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="exampleCheck1">
                                        <label class="form-check-label" for="exampleCheck1">Permanecer logado</label>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Entrar</button>
                                </form>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col">
                                <p>
                                    Ainda não tem conta? <a href="#">Criar uma conta</a>
                                </p>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col">
                                <img src="./assets/images/codai-logo.png" alt="logo da codai" srcset="">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col">
                                <img src="./assets/images/growdev-logo.png" alt="logo da growdev" srcset="">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
